[project]
name = "admissions"
version = "0.1.0"
description = "Check your transcript against the official admission rules of university programs in NRW, Germany, with a source for every rule."
readme = "README.md"
authors = [
    { name = "Mehedi Rahman", email = "mehedii.rahman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []



[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]